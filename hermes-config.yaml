model:
  provider: "gemini"
  default: "gemini-2.5-flash"
  fallback_chain:
    - "groq/openai/gpt-oss-120b"
    - "ollama/qwen2.5-coder"

gateway:
  slack:
    enabled: true
    mode: "socket"
    appToken: { source: "env", provider: "default", id: "SLACK_APP_TOKEN" }
    botToken: { source: "env", provider: "default", id: "SLACK_BOT_TOKEN" }
    channels:
      sprint_main: "#sprint-main"
      agent_coder: "#agent-coder"
      agent_log: "#agent-log"

interconnection:
  target_agent: "openclaw"
  delegation_channel: "#agent-coder"
  status_channel: "#agent-log"
  auto_dispatch: true

skills:
  directory: "./skills"
  preloaded:
    - "status-report"

memory:
  enabled: true
  path: "./memory"

